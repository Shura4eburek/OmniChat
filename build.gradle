plugins {
    id 'fabric-loom' version '1.15-SNAPSHOT'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

loom {
    splitEnvironmentSourceSets()

    mods {
        "omnichat" {
            sourceSet sourceSets.main
            sourceSet sourceSets.client
        }
    }

    // scripts/smoke.sh: dedicated server + a second client that watches the first one speak
    runs {
        smokeServer {
            server()
            configName = "Smoke Server"
            runDir = "run/smoke/server"
            ideConfigGenerated false
        }
        smokeListener {
            client()
            configName = "Smoke Listener"
            runDir = "run/smoke/listener"
            programArgs "--username", "Listener", "--quickPlayMultiplayer", "localhost:25599"
            ideConfigGenerated false
        }
    }
}

configurations {
    // onnxruntime as published on Maven; repackaged without debug symbols before nesting
    onnxruntimeJar
}

repositories {
    mavenCentral()
    // Loom only nests module components, so local jars are exposed through a flat repo
    flatDir {
        dirs layout.buildDirectory.dir('nested')
    }
}

// Nested library jars carry their own fabric.mod.json (gradle/nested/*) so the ids are valid and
// match what other mods would generate, letting Fabric keep a single copy.
// The Maven onnxruntime jar also carries ~300 MB of debug symbols (.pdb, .dSYM) that are never loaded.
tasks.register('onnxruntimeNested', Jar) {
    archiveFileName = 'onnxruntime-nested-1.19.2.jar'
    destinationDirectory = layout.buildDirectory.dir('nested')
    from(zipTree(configurations.onnxruntimeJar.singleFile)) {
        exclude '**/*.pdb'
        exclude '**/*.dSYM/**'
    }
    from('gradle/nested/onnxruntime')
}

tasks.register('sherpaNested', Jar) {
    archiveFileName = 'sherpa-onnx-nested-1.12.4.jar'
    destinationDirectory = layout.buildDirectory.dir('nested')
    from(zipTree('libs/sherpa-onnx-v1.12.4-java21.jar'))
    from('gradle/nested/sherpa-onnx')
}

dependencies {
    // To change the versions see the gradle.properties file
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"

    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

    // sherpa-onnx TTS (Java API)
    implementation files('libs/sherpa-onnx-v1.12.4-java21.jar')

    // Gson for config serialization
    implementation 'com.google.code.gson:gson:2.11.0'

    // ONNX Runtime for direct model inference (GLaDOS TTS)
    implementation 'com.microsoft.onnxruntime:onnxruntime:1.19.2'
    onnxruntimeJar('com.microsoft.onnxruntime:onnxruntime:1.19.2') { transitive = false }

    // Jar-in-jar instead of shading: Fabric dedupes nested libraries shared with other mods,
    // and onnxruntime keeps finding its natives under its own package path
    include ':sherpa-onnx-nested:1.12.4'
    include ':onnxruntime-nested:1.19.2'

    // `./gradlew prodClient` runs the built jar like a real launcher would
    productionRuntimeMods "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
}


tasks.register('prodClient', net.fabricmc.loom.task.prod.ClientProductionRunTask) {
    runDir = file('run/prod')
}

processResources {
    inputs.property "version", project.version
    inputs.property "minecraft_version", project.minecraft_version
    inputs.property "loader_version", project.loader_version
    filteringCharset "UTF-8"

    filesMatching("fabric.mod.json") {
        expand "version": project.version,
                "minecraft_version": project.minecraft_version,
                "loader_version": project.loader_version
    }
}

def targetJavaVersion = 21
tasks.withType(JavaCompile).configureEach {
    // ensure that the encoding is set to UTF-8, no matter what the system default is
    // this fixes some edge cases with special characters not displaying correctly
    // see http://yodaconditions.net/blog/fix-for-java-file-encoding-problems-with-gradle.html
    // If Javadoc is generated, this must be specified in that task too.
    it.options.encoding = "UTF-8"
    if (targetJavaVersion >= 10 || JavaVersion.current().isJava10Compatible()) {
        it.options.release.set(targetJavaVersion)
    }
}

java {
    def javaVersion = JavaVersion.toVersion(targetJavaVersion)
    if (JavaVersion.current() < javaVersion) {
        toolchain.languageVersion = JavaLanguageVersion.of(targetJavaVersion)
    }
    // Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
    // if it is present.
    // If you remove this line, sources will not be generated.
    withSourcesJar()
}

jar {
    from("LICENSE.txt") {
        rename { "LICENSE_${project.archives_base_name}.txt" }
    }
}

tasks.named('processIncludeJars') {
    dependsOn 'onnxruntimeNested', 'sherpaNested'
}
